<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seu Produto</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .hero {
      background: white;
      border-radius: 20px;
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #666;
      margin-bottom: 30px;
    }

    .price {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .buy-button {
      display: inline-block;
      background: #111;
      color: white;
      padding: 16px 35px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .buy-button:hover {
      opacity: .85;
    }

    .delivery {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="hero">

      <h1>Seu Produto</h1>

      <p>
        Uma descrição curta e profissional do produto.
      </p>

      <div class="price">
        R$ 00,00
      </div>

      <button class="buy-button" onclick="comprar()">
        COMPRAR AGORA
      </button>

      <div class="delivery">
        🚚 Entrega em até 3 dias
      </div>

    </section>

  </main>

  <script>
    function comprar() {
      alert("Checkout será conectado à Orbit.");
    }
  </script>

</body>
</html>
